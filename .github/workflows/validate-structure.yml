name: Validate docs file count

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/ has >= 3 files
        run: |
          set -euo pipefail
          MIN=3

          if [ ! -d "docs" ]; then
            echo "::error ::Required directory 'docs/' not found."
            exit 1
          fi

          COUNT=$(find docs -type f | wc -l | tr -d '[:space:]')
          echo "Found $COUNT file(s) under docs/"

          if [ "$COUNT" -lt "$MIN" ]; then
            echo "::error ::docs/ must contain at least $MIN files (found $COUNT)."
            exit 1
          fi

          echo "OK: docs/ contains >= $MIN files."
